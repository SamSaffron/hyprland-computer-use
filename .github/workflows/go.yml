name: Go checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Formatting, vet, native transaction tests, and Go race tests
        run: make test
      - name: Static analysis
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.6.1 -checks=all,-ST1000,-ST1005,-ST1013,-ST1021 ./...
      - name: Go vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - name: Required native Wayland wire test
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev
          make native-text-wire-test
      - name: Build the standalone Go executable
        run: make build/hyprland-computer-use
      - name: Install SBOM generator
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
      - name: Validate release packaging without publishing
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --snapshot --clean --skip=publish,sign

  native:
    uses: ./.github/workflows/native.yml
