name: Go checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Formatting, vet, native transaction tests, and Go race tests
        run: make test
      - name: Build the standalone Go executable
        run: make build/hyprland-computer-use
