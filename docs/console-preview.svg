<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Hyprland Computer Use permission console and granted window outline</title>
  <desc id="desc">A dark desktop preview showing the local permission console beside a browser window with a green CONTROL GRANTED outline.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b141b"/><stop offset="1" stop-color="#1d303c"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="15" flood-opacity=".45"/></filter>
  </defs>
  <rect width="1200" height="620" rx="18" fill="url(#bg)"/>
  <rect x="42" y="42" width="720" height="536" rx="12" fill="#e7edf0" filter="url(#shadow)"/>
  <rect x="42" y="42" width="720" height="48" rx="12" fill="#253743"/>
  <circle cx="70" cy="66" r="7" fill="#ed8a71"/><circle cx="93" cy="66" r="7" fill="#e5c36d"/><circle cx="116" cy="66" r="7" fill="#65d7b2"/>
  <rect x="78" y="128" width="648" height="62" rx="8" fill="#cbd8df"/>
  <rect x="78" y="218" width="302" height="300" rx="8" fill="#d7e1e6"/>
  <rect x="404" y="218" width="322" height="138" rx="8" fill="#c4d2d9"/>
  <rect x="404" y="380" width="322" height="138" rx="8" fill="#c4d2d9"/>
  <rect x="39" y="39" width="726" height="542" rx="14" fill="none" stroke="#65d7b2" stroke-width="6"/>
  <rect x="255" y="39" width="294" height="31" rx="6" fill="#65d7b2"/>
  <text x="402" y="60" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#10251e">CONTROL GRANTED · Seat · 287s</text>

  <rect x="802" y="30" width="358" height="560" rx="18" fill="#111e28" stroke="#405565" filter="url(#shadow)"/>
  <text x="830" y="76" font-family="sans-serif" font-size="29" font-weight="700" fill="#e9eff4">Computer Use</text>
  <text x="830" y="99" font-family="sans-serif" font-size="11" letter-spacing="1.4" fill="#9baebb">LOCAL PERMISSION CONSOLE</text>
  <line x1="830" y1="122" x2="1132" y2="122" stroke="#30424e"/>
  <text x="830" y="158" font-family="sans-serif" font-size="15" fill="#e9eff4">Mode</text>
  <rect x="892" y="137" width="240" height="42" rx="9" fill="#0d1922" stroke="#30424e"/>
  <rect x="897" y="142" width="113" height="32" rx="7" fill="#255749"/>
  <text x="953" y="163" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#e9eff4">Approve</text>
  <text x="1070" y="163" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#e9eff4">YOLO</text>
  <text x="830" y="212" font-family="sans-serif" font-size="13" fill="#9baebb">Only you can grant window access.</text>
  <rect x="830" y="235" width="142" height="38" rx="8" fill="#263b49"/><text x="901" y="259" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#e9eff4">Share window</text>
  <rect x="1037" y="235" width="95" height="38" rx="8" fill="#263b49"/><text x="1085" y="259" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#e9eff4">Pause</text>
  <text x="830" y="316" font-family="sans-serif" font-size="12" letter-spacing="1.2" fill="#9baebb">ACTIVE GRANTS</text>
  <rect x="830" y="334" width="302" height="112" rx="10" fill="#172832" stroke="#315244"/>
  <circle cx="850" cy="357" r="5" fill="#65d7b2"/>
  <text x="866" y="362" font-family="sans-serif" font-size="14" font-weight="700" fill="#e9eff4">control window: Browser</text>
  <text x="850" y="390" font-family="sans-serif" font-size="12" fill="#9baebb">OAuth Research Agent · 287s</text>
  <rect x="850" y="405" width="74" height="27" rx="6" fill="#55353a"/><text x="887" y="423" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffd0c5">Revoke</text>
  <text x="830" y="488" font-family="sans-serif" font-size="12" letter-spacing="1.2" fill="#9baebb">RECENT ACTIVITY</text>
  <text x="830" y="520" font-family="sans-serif" font-size="12" fill="#b5c3cc">granted · Browser for 300s</text>
  <text x="830" y="548" font-family="sans-serif" font-size="12" fill="#b5c3cc">requested · control window</text>
</svg>
